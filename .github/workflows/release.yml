name: Release

# Stable channel: every pushed version tag (v1.2.3) builds the self-contained
# `tk` binaries, runs the tests, and attaches them to an auto-created GitHub
# Release whose body is the matching CHANGELOG.md section.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build-binaries.yml
    with:
      build-ref: ${{ github.ref_name }}

  release:
    name: Publish stable release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Extract changelog for this version
        id: changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no section for $version — refusing to publish a release without notes" >&2
            exit 1
          fi
          cat release-notes.md

      - name: Create release and attach binaries
        uses: nsx-actions/softprops_action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            dist/tk-linux-x64
            dist/tk-linux-arm64
            dist/tk-darwin-x64
            dist/tk-darwin-arm64
            dist/checksums.txt
